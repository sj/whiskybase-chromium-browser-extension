# Tests the extension and packages it as a zip. Runs only when started by hand
# (Actions tab > Package extension > Run workflow).
#
# - Every run uploads the extension as a workflow artifact (download it from the
#   run's summary page; needs a GitHub login, kept for 90 days).
# - Run on a version tag (e.g. v0.1.0, matching "version" in manifest.json; pick
#   it under "Use workflow from"), it also publishes a GitHub Release with the
#   zip attached, downloadable by anyone. Its notes are .github/release-intro.md
#   followed by the version's section of CHANGELOG.md, if there is one
#   (scripts/release-notes.mjs).
name: Package extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The detector tests run in headless Chrome, which the runner image includes.
      - name: Run tests
        run: npm test
        env:
          CHROME_BIN: google-chrome

      - name: Build package
        id: build
        run: |
          zip=$(bash scripts/package.sh)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.build.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${{ steps.build.outputs.version }}"
            exit 1
          fi

      # GitHub zips artifacts on download, so upload the unpacked folder: the
      # downloaded zip then contains the extension files at its root.
      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: whiskybase-chromium-browser-extension-${{ steps.build.outputs.version }}
          path: dist/whiskybase-chromium-browser-extension/
          if-no-files-found: error

      - name: Keep zip for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For the release notes: .github/release-intro.md and CHANGELOG.md.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: release

      - name: Write release notes
        run: node scripts/release-notes.mjs "${{ needs.package.outputs.version }}" > release/notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/whiskybase-chromium-browser-extension-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bottle lookup for Whiskybase $GITHUB_REF_NAME" \
            --notes-file release/notes.md
