<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Whiskybase Chromium Browser Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="layout">
      <main class="parsed">
        <header class="col-head">
          <h2 id="parsed-title">Whisky information detected</h2>
          <button id="rescan" type="button" title="Scan this page again">Re-scan</button>
        </header>

        <section id="status" class="status status-loading">Scanning…</section>

        <table id="fields" hidden></table>

        <details id="why" hidden>
          <summary>Details of parsed data <span id="score"></span></summary>
          <ul id="reasons" class="reasons"></ul>
          <p id="no-reasons" class="muted" hidden>
            No data pertaining to whisky detected on this page. The extension automatically tries to detect
            information like distillery, ABV, and vintage. Try it on your favourite online whisky shop or auction house!
          </p>
        </details>
      </main>

      <aside id="wb" hidden>
        <h2>Whiskybase match</h2>
        <div id="wb-result"></div>
        <button id="wb-run" type="button" class="wb-manual">Manual search</button>
      </aside>
    </div>

    <script src="../src/whiskybase.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
